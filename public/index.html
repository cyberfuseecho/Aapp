<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silueta Background Remover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; text-align: center; }
    .subtitle { color: #8892b0; margin-bottom: 30px; text-align: center; }
    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .upload-area {
      border: 2px dashed #64ffda;
      border-radius: 15px;
      padding: 60px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 20px;
    }
    .upload-area:hover, .upload-area.dragover {
      background: rgba(100, 255, 218, 0.05);
      transform: scale(1.02);
    }
    .upload-area input { display: none; }
    .upload-icon { font-size: 3rem; margin-bottom: 15px; }
    .upload-text { color: #8892b0; }
    .images-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .image-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }
    .image-box h3 { margin-bottom: 10px; color: #64ffda; font-size: 0.9rem; }
    .image-box img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      display: none;
    }
    .image-box img.visible { display: block; margin: 0 auto; }
    .placeholder {
      width: 100%;
      height: 200px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.9rem;
    }
    .status {
      text-align: center;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      display: none;
    }
    .status.active { display: block; }
    .status.processing { background: rgba(100, 255, 218, 0.1); color: #64ffda; }
    .status.error { background: rgba(255, 100, 100, 0.1); color: #ff6464; }
    .status.success { background: rgba(100, 255, 100, 0.1); color: #64ff64; }
    .btn {
      background: #64ffda;
      color: #1a1a2e;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      display: none;
      margin: 20px auto 0;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(100,255,218,0.3); }
    .btn.visible { display: block; }
    .connection-status {
      position: fixed;
      top: 15px;
      right: 15px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .connection-status.connected { background: #64ffda; color: #1a1a2e; }
    .connection-status.disconnected { background: #ff6464; color: #fff; }
    .connection-status.connecting { background: #ffd700; color: #1a1a2e; }
    @media (max-width: 600px) {
      .images-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.5rem; }
    }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #64ffda;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="connection-status disconnected" id="connStatus">Disconnected</div>
  
  <h1>Silueta Background Remover</h1>
  <p class="subtitle">AI-powered background removal - 43MB model on Render</p>
  
  <div class="container">
    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/*">
      <div class="upload-icon">📁</div>
      <p class="upload-text">Drop an image or click to browse</p>
      <p class="upload-text" style="font-size: 0.8rem; margin-top: 8px;">Supports JPG, PNG, WEBP</p>
    </div>
    
    <div class="status" id="status"></div>
    
    <div class="images-grid">
      <div class="image-box">
        <h3>Original</h3>
        <div class="placeholder" id="originalPlaceholder">No image</div>
        <img id="originalImg" alt="Original">
      </div>
      <div class="image-box">
        <h3>Result</h3>
        <div class="placeholder" id="resultPlaceholder">Waiting...</div>
        <img id="resultImg" alt="Result">
      </div>
    </div>
    
    <button class="btn" id="downloadBtn">Download Result</button>
  </div>

  <script src="scripts/logic.js"></script>
</body>
</html>
